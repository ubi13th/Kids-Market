apply plugin: 'com.android.library'
**APPLY_PLUGINS**

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // --- Firebase Android SDK (відповідає Firebase Unity SDK 12.8.0) ---
    implementation 'com.google.firebase:firebase-auth:21.1.0'
    implementation 'com.google.firebase:firebase-database:20.3.0'
    implementation 'com.google.firebase:firebase-common:20.3.2'
    implementation 'com.google.firebase:firebase-analytics:21.3.0'

    // --- Firebase Unity Wrappers ---
    implementation 'com.google.firebase:firebase-app-unity:12.8.0'
    implementation 'com.google.firebase:firebase-auth-unity:12.8.0'
    implementation 'com.google.firebase:firebase-database-unity:12.8.0'

    // --- Google Play Services Base (обов’язково для Firebase) ---
    implementation 'com.google.android.gms:play-services-base:18.6.0'

    // --- Multidex support (якщо >65K методів) ---
    implementation 'androidx.multidex:multidex:2.0.1'

    **DEPS**
}

// --- Android Resolver Exclusions Start ---
android {
    packagingOptions {
        exclude('/lib/armeabi/*' + '*')
        exclude('/lib/mips/*' + '*')
        exclude('/lib/mips64/*' + '*')
        exclude('/lib/x86/*' + '*')
        exclude('/lib/x86_64/*' + '*')
    }
}
// --- Android Resolver Exclusions End ---

android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    compileSdkVersion **APIVERSION**
    buildToolsVersion '**BUILDTOOLS**'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdkVersion **MINSDKVERSION**
        targetSdkVersion **TARGETSDKVERSION**
        multiDexEnabled true

        ndk {
            abiFilters **ABIFILTERS**
        }

        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
    }

    lintOptions {
        abortOnError false
    }

    aaptOptions {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    **PACKAGING_OPTIONS**
}

**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**
